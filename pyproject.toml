[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "jgrapht"
version = "2.0.0"
description = "Python bindings for the JGraphT graph library"
readme = "README.md"
license = "EPL-2.0 OR LGPL-2.1-or-later"
license-files = ["license-EPL.txt", "license-LGPL.txt"]
requires-python = ">=3.10"
urls = { Homepage = "https://github.com/d-michail/python-jgrapht", Documentation = "https://python-jgrapht.readthedocs.io", Repository = "https://github.com/d-michail/python-jgrapht" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest", "matplotlib", "networkx", "pydot"]
plot = ["matplotlib"]
networkx = ["networkx"]
pydot = ["pydot"]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "sphinx-gallery>=0.15",
    "matplotlib",
    "networkx",
    "pydot",
    "pillow",
]

[tool.maturin]
python-source = "python"
module-name = "jgrapht._jgrapht_rs"
features = ["pyo3/extension-module"]
